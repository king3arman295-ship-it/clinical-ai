<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Lumina Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-shell { min-height: 100vh; display: flex; }
    .auth-brand {
      flex: 1 1 44%; display: flex; flex-direction: column; justify-content: space-between;
      background: var(--charcoal); color: #fff; padding: 48px;
      background-image: radial-gradient(ellipse 700px 500px at 15% 10%, rgba(201,162,39,0.16), transparent 60%);
    }
    .auth-brand-quote { font-family: var(--font-serif); font-size: 26px; line-height: 1.5; max-width: 420px; color: #fff; }
    .auth-brand-quote span { color: var(--gold-bright); }
    .auth-brand-foot { font-size: 13px; color: rgba(255,255,255,0.55); }
    .auth-form-side { flex: 1 1 56%; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--cream); }
    .auth-card { max-width: 440px; width: 100%; }
    .auth-brand .logo-icon {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 9px; background: var(--gold); color: var(--charcoal); flex-shrink: 0;
    }
    .auth-brand .logo-icon svg { width: 19px; height: 19px; }
    .auth-brand .logo { gap: 10px; margin-bottom: 4px; }
    @media (max-width: 860px) {
      .auth-brand { display: none; }
      .auth-form-side { flex: 1 1 100%; }
    }

    .auth-back-home {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13.5px; font-weight: 600; color: var(--charcoal, #003D2B);
      text-decoration: none; opacity: 0.75; transition: opacity 0.15s;
    }
    .auth-back-home:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <!-- Brand panel -->
    <aside class="auth-brand">
      <div class="logo">
        <span class="logo-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7a2 2 0 0 1 2-2h5V3h2v2h5a2 2 0 0 1 2 2v14"/><path d="M4 21h16"/><path d="M9 21v-4h6v4"/><path d="M12 8v4M10 10h4"/></svg></span>
        <div class="logo-text">
          <div class="logo-name" style="color:#fff;">Lumina</div>
          <div class="logo-tagline">Healthcare Portal</div>
        </div>
      </div>
      <p class="auth-brand-quote">Every patient record, appointment and department in <span>one calm, connected system.</span></p>
      <p class="auth-brand-foot">&copy; Lumina Health — Hospital Management System</p>
    </aside>

    <!-- Form panel -->
    <main class="auth-form-side">
      <div class="card auth-card" style="border-radius: 20px;" data-reveal>
        <div style="text-align: center; margin-bottom: 28px;">
          <h1 id="auth-title" style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Welcome Back</h1>
          <p id="auth-subtitle" style="color: var(--text-light);">Sign in to access your account</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" style="display: block;">
          <div id="login-error" class="alert alert-error" style="display: none;"></div>

          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="username" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input password-input" id="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" tabindex="-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 16px;">
            Sign In
          </button>

          <div style="text-align: center;">
            <button type="button" class="btn btn-ghost" style="width: 100%;" onclick="showRegisterForm()">
              New Patient? Create Account
            </button>
          </div>

          <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">
              ← Back to Home
            </a>
          </div>
        </form>

        <!-- Patient Registration Form -->
        <form id="register-form" style="display: none;">
          <div id="register-error" class="alert alert-error" style="display: none;"></div>

          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="reg-name" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-input" id="reg-phone" placeholder="03xx-xxxxxxx" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="reg-email" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="reg-username" placeholder="Choose a username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input password-input" id="reg-password" placeholder="Choose a strong password" required>
              <button type="button" class="password-toggle" onclick="togglePasswordVisibility('reg-password', this)" aria-label="Show password" tabindex="-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 16px;">
            Create Account
          </button>

          <button type="button" class="btn btn-ghost" style="width: 100%;" onclick="showLoginForm()">
            Already have an account? Sign In
          </button>
          <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">
              ← Back to Home
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="firebase.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
  <script src="js/scroll-reveal.js"></script>
</body>
</html>
